name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Same Python and exact package versions the published results were produced with.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install
        run: |
          pip install -r requirements-lock.txt
          pip install -e .

      - name: Lint
        run: |
          ruff check .
          ruff format --check src tests app.py

      - name: Tests
        # Unit tests run on hand-built and simulated data; output-integrity tests
        # read the committed outputs/; dashboard tests render every tab with
        # Streamlit's test harness. Tests that need the raw Kaggle data skip.
        run: pytest -q

      - name: dbt project compiles
        # The raw data isn't redistributable, so CI checks that the dbt project
        # parses and compiles; `dbt build` with all 34 data tests runs locally.
        working-directory: dbt
        run: dbt parse --profiles-dir .

