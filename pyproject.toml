[project]
name = "retailrev"
version = "1.0.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["dbt", "*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B008", "B905", "E501"]  # line length is enforced by `ruff format`; long SQL strings are exempt

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E501"]   # notebook markdown cells are prose
