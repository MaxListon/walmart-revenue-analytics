name: walmart_revenue
version: "1.0.0"
config-version: 2
profile: walmart_revenue

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  raw_path: "../data/raw"          # Kaggle M5 CSVs
  outputs_path: "../outputs"       # Python pipeline outputs, for cross-checks

models:
  walmart_revenue:
    staging:
      +materialized: table
    marts:
      +materialized: table
    metrics:
      +materialized: view
